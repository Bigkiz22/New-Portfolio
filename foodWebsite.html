<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kizito Food website</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <div class="min-h-screen bg-[url('images/restaurant%20background.jpg')] bg-cover bg-center bg-no-repeat text-white px-25 py-5 relative">
        <!-- NAVBAR -->
        <nav class="flex items-center space-x-8 " >
            <img src="images/restaurant logo.png" alt="Starboy Eats" class="w-40 cursor-pointer">
            <ul class="flex-1 text-center">
                <li class="list-none inline-block px-5"><a href="#" class="px-2">Home</a></li>
                <li class="list-none inline-block px-5"><a href="#" class="px-2">About</a></li>
                <li class="list-none inline-block px-5"><a href="#" class="px-2">Features</a></li>
                <li class="list-none inline-block px-5"><a href="#" class="px-2">Contact</a></li>
            </ul>
            <img src="images/cart.jpg" alt="Cart" class="w-40 cursor-pointer">
        </nav>

        <!-- HERO SECTION -->
        <div class="mt-40 px-10 max-w-4xl">
            <h1 class="text-6xl font-semibold leading-tight">Food<br>Delivered in <span >20 Minutes</span> </h1>
            <p class="mt-5">Starboy Eats offers a wide variety of delicious meals, all prepared with the freshest ingredients and delivered to your doorstep in just 20 minutes.</p>
        
        <!-- BUTTONS -->
            <div class="mt-5 text-black ">
            <a href="#" class="bg-green-700 px-6 py-3 rounded-lg inline-block mr-4 hover:bg-green-800 hover:-translate-y-2 transition duration-500">Order Now</a>
            <a href="#" class="bg-green-700 px-6 py-3 rounded-lg inline-block hover:bg-green-800 hover:-translate-y-2 transition duration-500">Download App</a>
            </div>
        </div>
        
        <img src="images/individual cooking.jpg" alt="Food Vendor" class="w-full xl:w-1/2 xl:absolute bottom-0 right-20">
    </div>
</body>
</html>
